<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biên bản bàn giao tài sản</title>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js" onerror="this.onerror=null;this.src='https://unpkg.com/html-docx-js/dist/html-docx.js';"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lockScreen">
  <form id="lockForm" class="lock-box" autocomplete="off">
	<div class="lock-icon">🔒</div>
	<h1>Biên bản bàn giao tài sản</h1>
	<p class="lock-sub">Nội dung đã được mã hóa. Vui lòng nhập mật khẩu để xem.</p>
	<input type="password" id="lockPassword" placeholder="Nhập mật khẩu" autocomplete="current-password">
	<button type="submit" id="lockSubmit">Mở khóa</button>
	<div id="lockError"></div>
  </form>
</div>

<div id="appRoot"></div>

<script src="crypto-util.js"></script>
<script src="content.enc.js"></script>
<script src="script.js"></script>
<script src="lock.js"></script>

</body>
</html>
